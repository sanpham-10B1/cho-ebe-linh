<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dành cho ebe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    width:100%;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}
.container{
    position:relative;
    width:min(90vw,500px);
}
svg{
    width:100%;
    overflow:visible;
    animation:beat 1.2s infinite;
}
@keyframes beat{
    0%,100%{transform:scale(1)}
    15%{transform:scale(1.06)}
    30%{transform:scale(1)}
    45%{transform:scale(1.04)}
    60%{transform:scale(1)}
}
.line{
    fill:none;
    stroke:#ff6b9d;
    stroke-width:1.3;
    opacity:.8;
}
.glow{
    fill:none;
    stroke:#ff4386;
    stroke-width:8;
    filter:url(#blur);
    opacity:.8;
}
.main{
    fill:none;
    stroke:url(#pink);
    stroke-width:8;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:url(#light);
}
.name{
    position:absolute;
    top:48%;
    left:50%;
    transform:translate(-50%,-50%);
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:clamp(35px,8vw,55px);
    font-weight:bold;
    color:#ff8db5;
    text-shadow:0 0 2px #ffb5d0,0 0 5px #ff4386;
    animation:textGlow 1.2s infinite alternate;
    pointer-events:none;
    white-space:nowrap;
}
@keyframes textGlow{
    from{
        text-shadow:0 0 2px #ffb5d0,0 0 4px #ff4386;
    }
    to{
        text-shadow:0 0 3px #ffb5d0,0 0 7px #ff4386;
    }
}
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 400 370" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff9bbd"/>
        <stop offset="35%" stop-color="#fff0f6"/>
        <stop offset="55%" stop-color="#ff4f91"/>
        <stop offset="80%" stop-color="#ffb5d0"/>
        <stop offset="100%" stop-color="#ff4386"/>
    </linearGradient>
    <filter id="light" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="blur">
        <feGaussianBlur stdDeviation="9"/>
    </filter>
</defs>
<g transform="rotate(-10 200 185)">
    <path d="M200 320 C175 286 35 240 35 140 C35 65 125 35 200 115 C275 35 365 65 365 140 C365 240 225 286 200 320Z"
          fill="#242124" stroke="#51434b" stroke-width="2"/>
    <path class="line"
          d="M200 313 C175 280 42 235 42 140 C42 72 128 43 200 118 C272 43 358 72 358 140 C358 235 225 280 200 313Z"/>
    <path class="line"
          d="M200 305 C174 273 51 230 51 140 C51 79 132 52 200 122 C268 52 349 79 349 140 C349 230 226 273 200 305Z"/>
    <path class="glow"
          d="M200 296 C170 260 68 226 68 143 C68 91 135 62 200 128 C265 62 332 91 332 143 C332 226 230 260 200 296Z"/>
    <path class="main"
          d="M200 296 C170 260 68 226 68 143 C68 91 135 62 200 128 C265 62 332 91 332 143 C332 226 230 260 200 296Z"/>
</g>
</svg>
<div class="name">Linh</div>
</div>
</body>
</html>
